name: Daily Price & Ratio Update (No AI)

on:
  schedule:
    # 23:00 UTC CN-T5 = 06:00 sáng T2-T6 (giờ VN)
    - cron: '0 23 * * 0-4' 
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-data-json
  cancel-in-progress: false

jobs:
  update-price:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Update price & ratios
        run: python update_screener.py

      - name: Validate data.json
        run: |
          python -c "
          import json
          d = json.load(open('data.json', encoding='utf-8'))
          assert len(d) > 0, 'data.json rỗng!'
          print(f'✅ Validate OK: {len(d)} mã')
          "

      - name: Commit and push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          if git diff --staged --quiet; then
            echo "Không có thay đổi."
            exit 0
          fi
          git commit -m "📈 Daily price+ratio update $(date -u +'%Y-%m-%d')"
          git pull --rebase origin main || true
          git push

      - name: Send Telegram Notification
        if: always()
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          JOB_STATUS: ${{ job.status }}
        run: |
          if [ "$JOB_STATUS" != "success" ]; then
            MSG="⚠️ <b>Cảnh báo: Workflow Giá & Chỉ số bị lỗi!</b>%0A%0A- Trạng thái: $JOB_STATUS%0A- Vui lòng kiểm tra GitHub Actions."
          elif [ -f telegram_msg.txt ]; then
            MSG=$(cat telegram_msg.txt | sed ':a;N;$!ba;s/\n/%0A/g')
          else
            MSG="⚠️ Workflow chạy xong nhưng không tìm thấy file telegram_msg.txt"
          fi
          
          curl -s -X POST "https://api.telegram.org/bot$TELEGRAM_TOKEN/sendMessage" \
            -d chat_id="$TELEGRAM_CHAT_ID" \
            -d text="$MSG" \
            -d parse_mode="HTML"
