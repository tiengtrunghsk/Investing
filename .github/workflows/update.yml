name: Auto Update Quant Screener & AI Insights

on:
  schedule:
    - cron: '0 0 * * *' # Tự động chạy mỗi ngày lúc 00:00 UTC
  workflow_dispatch: # Cho phép bấm chạy thủ công trên GitHub

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests

      - name: Run Python Script & Call AI
        env:
          ALIBABA_API_KEY: ${{ secrets.ALIBABA_API_KEY }}
        run: python update_screener.py

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          git commit -m "🤖 Auto-update AI Insights via Qwen API" || exit 0
          git push
