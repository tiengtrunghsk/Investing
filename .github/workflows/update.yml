name: Auto Update Quant Screener & AI Insights

on:
  schedule:
    - cron: '0 0 * * *'   # 00:00 UTC = 07:00 sáng giờ Việt Nam
  workflow_dispatch:

permissions:
  contents: write

# Ngăn 2 job chạy song song gây conflict push
concurrency:
  group: update-screener
  cancel-in-progress: false

jobs:
  update-data:
    runs-on: ubuntu-latest
    timeout-minutes: 60   # Giới hạn cứng tránh treo tốn minutes

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: pip install "requests>=2.31,<3.0"

      - name: Run Python Script
        env:
          ALIBABA_API_KEY: ${{ secrets.ALIBABA_API_KEY }}
        run: python update_screener.py

      - name: Validate data.json
        run: |
          python -c "
          import json
          with open('data.json', encoding='utf-8') as f:
              d = json.load(f)
          assert len(d) > 0, 'data.json rỗng!'
          print(f'✅ Validate OK: {len(d)} mã')
          "

      - name: Commit and push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json

          if git diff --staged --quiet; then
            echo "Không có thay đổi, bỏ qua commit."
            exit 0
          fi

          git commit -m "🤖 Auto-update: chỉ số VNDIRECT + AI Qwen $(date -u +'%Y-%m-%d')"
          git pull --rebase origin main || true
          git push
