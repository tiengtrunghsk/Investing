name: Update Screener & AI Data

on:
  schedule:
    - cron: '0 1 * * *'  # Chạy tự động hàng ngày lúc 1:00 UTC (khoảng 8:00 sáng giờ VN)
  workflow_dispatch:      # Cho phép bạn bấm nút chạy thủ công trên GitHub

jobs:
  update-data:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run Screener and AI Script
        env:
          ALIBABA_API_KEY: ${{ secrets.ALIBABA_API_KEY }}
        run: |
          python update_screener.py

      - name: Commit and push changes if data changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "🤖 Auto-update AI screener data [skip ci]" && git push)

      - name: Send Telegram Notification
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -f "telegram_msg.txt" ] && [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -n "$TELEGRAM_CHAT_ID" ]; then
            MESSAGE=$(cat telegram_msg.txt)
            curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              -d "chat_id=${TELEGRAM_CHAT_ID}" \
              -d "parse_mode=HTML" \
              --data-urlencode "text=${MESSAGE}"
          else
            echo "⚠️ Bỏ qua gửi Telegram do thiếu Token/Chat ID hoặc không có nội dung."
          fi
