name: Pro Quant Auto Bot

on:
  schedule:
    - cron: '30 8 * * 1-5'  # Chạy tự động lúc 15:30 giờ VN (08:30 UTC) từ Thứ Hai đến Thứ Sáu
  workflow_dispatch:          # Cho phép bấm nút chạy thủ công (Run workflow) bất cứ lúc nào

jobs:
  run-screener:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies Directly
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install streamlit pandas pandas-ta requests
          pip install vnstock

      - name: Run Auto Bot Mode
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python app.py --auto
