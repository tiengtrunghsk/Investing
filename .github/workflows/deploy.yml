name: Pro Quant Auto Bot

on:
  schedule:
    # 08:30 UTC = 15:30 giờ VN (Thị trường đã đóng cửa)
    - cron: '30 8 * * 1-5'
  workflow_dispatch: # Cho phép chạy thủ công bằng tay

jobs:
  run-screener:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install streamlit pandas requests
          pip install vnstock==5.0.1 --extra-index-url https://vnstocks.com/api/packages

      - name: Register vnstock Device
        env:
          VNSTOCK_API_KEY: ${{ secrets.VNSTOCK_API_KEY }}
        run: |
          printf '%s' "$VNSTOCK_API_KEY" | vnstock register --stdin

      - name: Run Auto Bot Mode
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          VNSTOCK_API_KEY: ${{ secrets.VNSTOCK_API_KEY }}
        run: python app.py --auto
