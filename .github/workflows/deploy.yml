name: Pro Quant Auto Bot

on:
  schedule:
    # 08:30 UTC = 15:30 giờ VN (Thị trường đã đóng cửa, chờ ATC xong)
    - cron: '30 8 * * 1-5'
  workflow_dispatch: # Cho phép chạy thủ công bằng tay

jobs:
  run-screener:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip' # Tự động cache thư viện để chạy nhanh hơn ở các lần sau

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          # Cài đặt các thư viện cơ bản trước
          pip install streamlit pandas requests
          # Cài đặt vnstock từ kho lưu trữ chính thức của họ (không phải PyPI)
          pip install vnstock --extra-index-url https://vnstocks.com/api/packages
          
      - name: Run Auto Bot Mode
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python app.py --auto
