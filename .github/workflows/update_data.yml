name: VN100 Screener & Telegram Alert

on:
  workflow_dispatch: # Cho phép bấm nút chạy thủ công trên giao diện GitHub Actions
  schedule:
    - cron: '0 1 * * 1-5' # Chạy tự động lúc 8:00 sáng (giờ VN) từ Thứ 2 đến Thứ 6

jobs:
  run-screener:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Cho phép GitHub Actions tự động commit file data.json lên repo
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests numpy

      - name: Run update_screener.py (Cập nhật giá, P/E, P/B định lượng)
        run: python update_screener.py

      - name: Run scanner.py (Quét tín hiệu D1: Cạn cung, Breakout & Gửi Telegram)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scanner.py

      - name: Commit and push updated data.json
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "🤖 Auto-update data.json & send Telegram alert" && git push)
