name: AI Evaluation Update (Qwen)

on:
  workflow_dispatch:
  schedule:
    - cron: '30 2 * * 1-5' # Chạy định kỳ lúc 9h30 sáng (giờ VN) các ngày trong tuần

jobs:
  run-ai:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run AI analysis script
        env:
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
        run: python update_ai.py

      - name: Commit and push updated data.json
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "🤖 Auto-update AI business valuation and recommendations" && git push)
