name: AI Evaluation Update (Qwen)

on:
  schedule:
    # 22:45 UTC Chủ Nhật = 05:45 sáng Thứ 2 (giờ VN)
    - cron: '45 22 * * 0'
  workflow_dispatch: # Cho phép bấm chạy thủ công bằng tay

permissions:
  contents: write

concurrency:
  group: update-data-json
  cancel-in-progress: false

jobs:
  update-ai:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: pip install "requests>=2.31,<3.0"

      - name: Run AI Update Script
        env:
          ALIBABA_API_KEY: ${{ secrets.ALIBABA_API_KEY }}
        run: python update_ai.py

      - name: Validate data.json
        run: |
          python -c "
          import json
          d = json.load(open('data.json', encoding='utf-8'))
          assert len(d) > 0, 'File data.json bị rỗng!'
          has_ai = sum(1 for v in d.values() if v.get('bctc'))
          print(f'✅ Dữ liệu hợp lệ: {len(d)} mã, {has_ai} mã có đánh giá AI')
          "

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          if git diff --staged --quiet; then
            echo "Không có thay đổi nào, bỏ qua commit."
            exit 0
          fi
          git commit -m "🤖 AI Evaluation update $(date -u +'%Y-%m-%d')"
          git pull --rebase origin main || true
          git push

      - name: Send Telegram Notification
        if: always()
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          JOB_STATUS: ${{ job.status }}
        run: |
          if [ "$JOB_STATUS" != "success" ]; then
            MSG="⚠️ <b>Cảnh báo: Workflow AI bị lỗi!</b>%0A%0A- Trạng thái: $JOB_STATUS%0A- Vui lòng kiểm tra GitHub Actions."
          elif [ -f telegram_msg.txt ]; then
            MSG=$(cat telegram_msg.txt | sed ':a;N;$!ba;s/\n/%0A/g')
          else
            MSG="⚠️ Workflow chạy xong nhưng không tìm thấy file telegram_msg.txt"
          fi
          
          curl -s -X POST "https://api.telegram.org/bot$TELEGRAM_TOKEN/sendMessage" \
            -d chat_id="$TELEGRAM_CHAT_ID" \
            -d text="$MSG" \
            -d parse_mode="HTML"
