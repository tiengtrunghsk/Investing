name: AI Evaluation Update (Qwen)

on:
  schedule:
    # 22:45 UTC Chủ Nhật = 05:45 sáng Thứ 2 (giờ VN)
    - cron: '45 22 * * 0'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-ai:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install "requests>=2.31,<3.0"

      - name: Update AI evaluation
        env:
          ALIBABA_API_KEY: ${{ secrets.ALIBABA_API_KEY }}
        run: python update_ai.py

      - name: Commit and push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          if git diff --staged --quiet; then
            echo "Không có thay đổi."
            exit 0
          fi
          git commit -m "🤖 AI evaluation update $(date -u +'%Y-%m-%d')"
          git pull --rebase origin main || true
          git push

      - name: Send Telegram Notification
        if: always()
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          JOB_STATUS: ${{ job.status }}
        run: |
          if [ "$JOB_STATUS" != "success" ]; then
            MSG="⚠️ <b>Cảnh báo: Workflow Đánh giá AI bị lỗi!</b>%0A%0A- Trạng thái: $JOB_STATUS"
          elif [ -f telegram_msg.txt ]; then
            MSG=$(cat telegram_msg.txt | sed ':a;N;$!ba;s/\n/%0A/g')
          else
            MSG="⚠️ Workflow chạy xong nhưng không có telegram_msg.txt"
          fi
          
          curl -s -X POST "https://api.telegram.org/bot$TELEGRAM_TOKEN/sendMessage" \
            -d chat_id="$TELEGRAM_CHAT_ID" \
            -d text="$MSG" \
            -d parse_mode="HTML"
