name: AI Evaluation Update (Qwen)

on:
  # Tách lịch riêng — ví dụ mỗi thứ Hai hàng tuần
  schedule:
    - cron: '0 1 * * 1'   # 08:00 sáng thứ Hai VN
  workflow_dispatch:        # Cho phép chạy tay bất cứ lúc nào

permissions:
  contents: write

concurrency:
  group: update-data-json   # CÙNG GROUP để không đè lên daily job
  cancel-in-progress: false

jobs:
  update-ai:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: pip install "requests>=2.31,<3.0"

      - name: Update AI evaluation
        env:
          ALIBABA_API_KEY: ${{ secrets.ALIBABA_API_KEY }}
        run: python update_ai.py

      - name: Validate data.json
        run: |
          python -c "
          import json
          d = json.load(open('data.json', encoding='utf-8'))
          assert len(d) > 0
          has_ai = sum(1 for v in d.values() if v.get('bctc'))
          print(f'✅ {len(d)} mã, {has_ai} mã có đánh giá AI')
          "

      - name: Commit and push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          if git diff --staged --quiet; then
            echo "Không có thay đổi."
            exit 0
          fi
          git commit -m "🤖 AI evaluation update $(date -u +'%Y-%m-%d')"
          git pull --rebase origin main || true
          git push
