<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pro Quant Stock Screener Pro</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen">

    <!-- Header Section -->
    <header class="border-b border-slate-800 bg-slate-900/80 backdrop-blur sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-4 flex flex-col md:flex-row justify-between items-center gap-4">
            <div class="flex items-center gap-3">
                <div class="p-2.5 bg-blue-600 rounded-xl text-white shadow-lg shadow-blue-500/30">
                    <i class="fa-solid fa-chart-line text-xl"></i>
                </div>
                <div>
                    <h1 class="text-xl font-bold bg-gradient-to-r from-white to-slate-400 bg-clip-text text-transparent">
                        Pro Quant Screener Pro
                    </h1>
                    <p class="text-xs text-slate-400">Kỹ thuật & Cơ bản chuyên nghiệp</p>
                </div>
            </div>

            <button id="scanBtn" onclick="startScreening()" class="w-full md:w-auto px-5 py-2.5 bg-blue-600 hover:bg-blue-500 text-white font-medium text-sm rounded-xl shadow-lg shadow-blue-600/25 transition-all flex items-center justify-center gap-2">
                <i class="fa-solid fa-bolt"></i>
                <span>Chạy Quét Toàn Diện</span>
            </button>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-7xl mx-auto px-4 py-6 space-y-6">

        <!-- Status Bar -->
        <div id="statusCard" class="bg-slate-800/50 border border-slate-700/50 rounded-2xl p-4 hidden">
            <div class="flex justify-between items-center text-sm mb-2">
                <span id="statusText" class="text-slate-300 font-medium">Đang chuẩn bị...</span>
                <span id="statusCount" class="text-blue-400 font-mono">0 / 0</span>
            </div>
            <div class="w-full bg-slate-700 rounded-full h-2 overflow-hidden">
                <div id="progressBar" class="bg-blue-500 h-full w-0 transition-all duration-150"></div>
            </div>
        </div>

        <!-- Results Grid -->
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
            
            <!-- Breakout Table Card -->
            <div class="bg-slate-800/40 border border-slate-800 rounded-2xl p-4 space-y-4">
                <div class="flex justify-between items-center">
                    <h2 class="text-base font-semibold text-emerald-400 flex items-center gap-2">
                        <i class="fa-solid fa-rocket"></i>
                        <span>Nhóm Breakout</span>
                    </h2>
                    <span id="breakoutBadge" class="px-2.5 py-0.5 rounded-full text-xs font-semibold bg-emerald-500/10 text-emerald-400 border border-emerald-500/20">
                        0 mã
                    </span>
                </div>
                
                <div class="overflow-x-auto -mx-4 px-4 sm:mx-0 sm:px-0">
                    <table class="w-full text-left text-sm whitespace-nowrap">
                        <thead class="text-xs text-slate-400 border-b border-slate-700/60 uppercase">
                            <tr>
                                <th class="py-3 px-2">Mã</th>
                                <th class="py-3 px-2">Giá / Ngành</th>
                                <th class="py-3 px-2 text-center">P/E</th>
                                <th class="py-3 px-2 text-center">P/B</th>
                                <th class="py-3 px-2 text-center">ROE</th>
                            </tr>
                        </thead>
                        <tbody id="breakoutBody" class="divide-y divide-slate-800 text-slate-200">
                            <tr>
                                <td colspan="5" class="py-8 text-center text-slate-500 text-xs">Bấm nút quét để bắt đầu.</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- Squeeze Table Card -->
            <div class="bg-slate-800/40 border border-slate-800 rounded-2xl p-4 space-y-4">
                <div class="flex justify-between items-center">
                    <h2 class="text-base font-semibold text-amber-400 flex items-center gap-2">
                        <i class="fa-solid fa-box"></i>
                        <span>Nhóm Squeeze (Cạn Cung)</span>
                    </h2>
                    <span id="squeezeBadge" class="px-2.5 py-0.5 rounded-full text-xs font-semibold bg-amber-500/10 text-amber-400 border border-amber-500/20">
                        0 mã
                    </span>
                </div>

                <div class="overflow-x-auto -mx-4 px-4 sm:mx-0 sm:px-0">
                    <table class="w-full text-left text-sm whitespace-nowrap">
                        <thead class="text-xs text-slate-400 border-b border-slate-700/60 uppercase">
                            <tr>
                                <th class="py-3 px-2">Mã</th>
                                <th class="py-3 px-2">Giá / Ngành</th>
                                <th class="py-3 px-2 text-center">P/E</th>
                                <th class="py-3 px-2 text-center">P/B</th>
                                <th class="py-3 px-2 text-center">ROE</th>
                            </tr>
                        </thead>
                        <tbody id="squeezeBody" class="divide-y divide-slate-800 text-slate-200">
                            <tr>
                                <td colspan="5" class="py-8 text-center text-slate-500 text-xs">Bấm nút quét để bắt đầu.</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>

        </div>
    </main>

    <!-- JavaScript Application Logic -->
    <script>
        const CURATED_STOCKS = {
            "VCB": { industry: "Ngân hàng", pe: 16.5, pb: 3.2, roe: 21.0 },
            "BID": { industry: "Ngân hàng", pe: 12.8, pb: 2.1, roe: 18.5 },
            "CTG": { industry: "Ngân hàng", pe: 10.2, pb: 1.5, roe: 16.2 },
            "TCB": { industry: "Ngân hàng", pe: 11.5, pb: 1.8, roe: 17.0 },
            "MBB": { industry: "Ngân hàng", pe: 8.5, pb: 1.4, roe: 20.5 },
            "ACB": { industry: "Ngân hàng", pe: 9.1, pb: 1.7, roe: 22.0 },
            "STB": { industry: "Ngân hàng", pe: 12.0, pb: 1.6, roe: 15.0 },
            "SHB": { industry: "Ngân hàng", pe: 7.2, pb: 0.9, roe: 14.5 },
            "TPB": { industry: "Ngân hàng", pe: 10.8, pb: 1.5, roe: 16.0 },
            "VIB": { industry: "Ngân hàng", pe: 11.0, pb: 2.0, roe: 24.0 },
            "HDB": { industry: "Ngân hàng", pe: 8.2, pb: 1.6, roe: 22.5 },
            "SSI": { industry: "Chứng khoán", pe: 20.5, pb: 2.2, roe: 12.5 },
            "VCI": { industry: "Chứng khoán", pe: 22.1, pb: 2.4, roe: 13.0 },
            "HCM": { industry: "Chứng khoán", pe: 19.8, pb: 2.1, roe: 12.0 },
            "VIX": { industry: "Chứng khoán", pe: 16.0, pb: 1.5, roe: 11.0 },
            "MBS": { industry: "Chứng khoán", pe: 15.2, pb: 1.8, roe: 14.0 },
            "FTS": { industry: "Chứng khoán", pe: 14.5, pb: 2.0, roe: 16.5 },
            "VIC": { industry: "Bất động sản", pe: 45.0, pb: 1.1, roe: 3.5 },
            "VHM": { industry: "Bất động sản", pe: 6.8, pb: 1.0, roe: 18.0 },
            "VRE": { industry: "Bất động sản", pe: 13.5, pb: 1.4, roe: 10.5 },
            "KBC": { industry: "Bất động sản", pe: 18.2, pb: 1.5, roe: 9.0 },
            "DIG": { industry: "Bất động sản", pe: 30.5, pb: 1.7, roe: 6.0 },
            "PDR": { industry: "Bất động sản", pe: 22.0, pb: 2.1, roe: 11.5 },
            "HPG": { industry: "Thép & VLXD", pe: 13.5, pb: 1.6, roe: 13.2 },
            "NKG": { industry: "Thép & VLXD", pe: 15.0, pb: 1.3, roe: 10.0 },
            "HSG": { industry: "Thép & VLXD", pe: 14.2, pb: 1.2, roe: 9.5 },
            "FPT": { industry: "Công nghệ", pe: 24.5, pb: 4.8, roe: 26.0 },
            "MWG": { industry: "Bán lẻ", pe: 25.0, pb: 3.1, roe: 15.0 },
            "PNJ": { industry: "Bán lẻ", pe: 16.2, pb: 2.8, roe: 20.0 },
            "FRT": { industry: "Bán lẻ", pe: 50.0, pb: 6.5, roe: 18.0 },
            "VNM": { industry: "Tiêu dùng", pe: 18.5, pb: 4.2, roe: 28.0 },
            "MSN": { industry: "Tiêu dùng", pe: 35.0, pb: 3.0, roe: 9.0 },
            "GAS": { industry: "Năng lượng", pe: 16.0, pb: 2.2, roe: 15.0 },
            "POW": { industry: "Năng lượng", pe: 19.0, pb: 0.9, roe: 5.5 },
            "BSR": { industry: "Năng lượng", pe: 11.0, pb: 1.0, roe: 10.0 },
            "DGC": { industry: "Hóa chất", pe: 12.5, pb: 2.8, roe: 25.0 }
        };

        async function fetchStockHistory(symbol) {
            const end = Math.floor(Date.now() / 1000);
            const start = end - (120 * 86400);
            const url = `https://dchart-api.vndirect.com.vn/dchart/history?resolution=D&symbol=${symbol}&from=${start}&to=${end}`;
            
            try {
                const response = await fetch(url);
                if (!response.ok) return null;
                const data = await response.json();
                if (data.s === "ok" && data.c.length >= 20) return data;
            } catch (err) {
                return null;
            }
            return null;
        }

        function analyzeData(symbol, info, data) {
            const len = data.c.length;
            const close = data.c;
            const high = data.h;
            const low = data.l;
            const volume = data.v;

            let sumClose20 = 0, sumVol20 = 0;
            for (let i = len - 20; i < len; i++) {
                sumClose20 += close[i];
                sumVol20 += volume[i];
            }
            const ma20 = sumClose20 / 20;
            const volMa20 = sumVol20 / 20;

            const currClose = close[len - 1];
            const prevClose = close[len - 2];
            const currVol = volume[len - 1];

            let sumClose20Prev = 0;
            for (let i = len - 21; i < len - 1; i++) {
                sumClose20Prev += close[i];
            }
            const prevMa20 = sumClose20Prev / 20;

            if (currVol < 50000) return null;

            const isBreakout = (currClose > ma20) && (prevClose <= prevMa20) && (currVol > 1.5 * volMa20);

            let sumRange5 = 0, sumClose5 = 0;
            for (let i = len - 5; i < len; i++) {
                sumRange5 += (high[i] - low[i]);
                sumClose5 += close[i];
            }
            const avgClose5 = sumClose5 / 5;
            const avgRange5 = sumRange5 / 5;
            const priceRangeRatio = avgClose5 > 0 ? (avgRange5 / avgClose5) : 1;

            const isSqueeze = (priceRangeRatio < 0.02) && (currVol < 0.8 * volMa20);

            if (isBreakout || isSqueeze) {
                return {
                    symbol,
                    industry: info.industry,
                    close: currClose,
                    pe: info.pe,
                    pb: info.pb,
                    roe: info.roe,
                    isBreakout,
                    isSqueeze
                };
            }
            return null;
        }

        async function startScreening() {
            const scanBtn = document.getElementById("scanBtn");
            const statusCard = document.getElementById("statusCard");
            const progressBar = document.getElementById("progressBar");
            const statusText = document.getElementById("statusText");
            const statusCount = document.getElementById("statusCount");
            
            const breakoutBody = document.getElementById("breakoutBody");
            const squeezeBody = document.getElementById("squeezeBody");

            scanBtn.disabled = true;
            scanBtn.classList.add("opacity-50", "cursor-not-allowed");
            statusCard.classList.remove("hidden");

            breakoutBody.innerHTML = `<tr><td colspan="5" class="py-8 text-center text-slate-500 text-xs">Đang quét dữ liệu...</td></tr>`;
            squeezeBody.innerHTML = `<tr><td colspan="5" class="py-8 text-center text-slate-500 text-xs">Đang quét dữ liệu...</td></tr>`;

            const entries = Object.entries(CURATED_STOCKS);
            const total = entries.length;
            let processed = 0;

            const breakouts = [];
            const squeezes = [];

            const BATCH_SIZE = 5;
            for (let i = 0; i < total; i += BATCH_SIZE) {
                const batch = entries.slice(i, i + BATCH_SIZE);
                
                await Promise.all(batch.map(async ([symbol, info]) => {
                    const history = await fetchStockHistory(symbol);
                    if (history) {
                        const res = analyzeData(symbol, info, history);
                        if (res) {
                            if (res.isBreakout) breakouts.push(res);
                            if (res.isSqueeze) squeezes.push(res);
                        }
                    }
                    processed++;
                    const percent = Math.round((processed / total) * 100);
                    progressBar.style.width = `${percent}%`;
                    statusText.innerText = `Quét: ${symbol}`;
                    statusCount.innerText = `${processed}/${total}`;
                }));
            }

            // Gộp Giá và Ngành làm 1 cột thông minh để hiển thị gọn trên mobile
            const renderRows = (items) => {
                return items.map(item => `
                    <tr class="hover:bg-slate-800/60 transition-colors">
                        <td class="py-3 px-2 font-bold text-amber-400">${item.symbol}</td>
                        <td class="py-3 px-2">
                            <div class="font-mono text-slate-100">${item.close.toLocaleString('vi-VN')}</div>
                            <div class="text-[10px] text-slate-400">${item.industry}</div>
                        </td>
                        <td class="py-3 px-2 text-center font-mono text-xs text-blue-300">${item.pe}</td>
                        <td class="py-3 px-2 text-center font-mono text-xs text-amber-300">${item.pb}</td>
                        <td class="py-3 px-2 text-center font-mono text-xs text-purple-300">${item.roe}%</td>
                    </tr>
                `).join('');
            };

            document.getElementById("breakoutBadge").innerText = `${breakouts.length} mã`;
            breakoutBody.innerHTML = breakouts.length > 0 ? renderRows(breakouts) : `<tr><td colspan="5" class="py-6 text-center text-slate-500 text-xs">Không có mã nào.</td></tr>`;

            document.getElementById("squeezeBadge").innerText = `${squeezes.length} mã`;
            squeezeBody.innerHTML = squeezes.length > 0 ? renderRows(squeezes) : `<tr><td colspan="5" class="py-6 text-center text-slate-500 text-xs">Không có mã nào.</td></tr>`;

            statusText.innerText = "Hoàn tất!";
            scanBtn.disabled = false;
            scanBtn.classList.remove("opacity-50", "cursor-not-allowed");
        }

        window.addEventListener("DOMContentLoaded", () => {
            startScreening();
        });
    </script>
</body>
</html>
