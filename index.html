<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pro Quant Screener - Direct API (Debug Mode)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #475569; }
        
        /* Hiệu ứng cho Toast thông báo */
        #toast { transition: opacity 0.3s, transform 0.3s; transform: translateY(20px); opacity: 0; pointer-events: none; }
        #toast.show { transform: translateY(0); opacity: 1; pointer-events: auto; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans relative">

    <!-- Header -->
    <header class="bg-slate-900 border-b border-slate-800 sticky top-0 z-30 shadow-md">
        <div class="max-w-7xl mx-auto px-4 py-4 flex flex-col md:flex-row justify-between items-center gap-4">
            <div class="flex items-center space-x-3">
                <div class="bg-blue-600 text-white p-2.5 rounded-xl shadow-lg shadow-blue-500/30">
                    <i class="fa-solid fa-chart-candlestick text-xl"></i>
                </div>
                <div>
                    <h1 class="text-xl font-bold tracking-wide text-white">Pro Quant Screener <span class="text-xs bg-rose-500/20 text-rose-400 px-2 py-0.5 rounded border border-rose-500/30">Debug Mode</span></h1>
                    <p class="text-xs text-slate-400">Hiển thị chi tiết lỗi kết nối API</p>
                </div>
            </div>
            
            <div class="flex items-center gap-3">
                <div class="text-xs text-slate-300 bg-slate-800/60 px-3 py-2 rounded-lg border border-slate-700/50 hidden md:block">
                    <i class="fa-solid fa-database text-blue-400 mr-1"></i> Đã tải: <strong id="total-stocks" class="text-white">0</strong>/70
                </div>
                
                <button onclick="exportJSON()" id="btn-export" class="px-3.5 py-2 bg-slate-800 hover:bg-slate-700 border border-slate-600 text-white rounded-lg text-sm font-semibold transition flex items-center gap-2 shadow opacity-50 cursor-not-allowed" disabled>
                    <i class="fa-solid fa-file-export text-emerald-400"></i> <span>Xuất JSON</span>
                </button>

                <button onclick="startScan()" id="btn-scan" class="px-4 py-2 bg-blue-600 hover:bg-blue-500 text-white rounded-lg text-sm font-semibold transition flex items-center gap-2 shadow">
                    <i class="fa-solid fa-play" id="scan-icon"></i> <span id="scan-text">Bắt đầu Quét</span>
                </button>
            </div>
        </div>
        
        <!-- Thanh tiến trình -->
        <div id="progress-bar" class="w-full bg-slate-800 h-1 hidden">
            <div id="progress-fill" class="bg-blue-500 h-1 transition-all duration-300" style="width: 0%"></div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-7xl mx-auto px-4 py-6">
        <div class="bg-slate-900 p-4 rounded-xl border border-slate-800 shadow-sm mb-6 flex flex-col md:flex-row justify-between items-center gap-4">
            <div class="relative w-full md:w-80">
                <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-slate-400">
                    <i class="fa-solid fa-magnifying-glass"></i>
                </span>
                <input type="text" id="search-input" placeholder="Tìm kiếm mã..." 
                    class="w-full pl-10 pr-4 py-2 bg-slate-950 border border-slate-700 rounded-lg text-sm text-white focus:outline-none focus:border-blue-500 transition">
            </div>
            <div class="flex gap-2 text-xs">
                <span class="bg-emerald-500/20 text-emerald-400 px-2 py-1 rounded border border-emerald-500/30"><i class="fa-solid fa-arrow-trend-up mr-1"></i> Breakout</span>
                <span class="bg-amber-500/20 text-amber-400 px-2 py-1 rounded border border-amber-500/30"><i class="fa-solid fa-box-archive mr-1"></i> Tích lũy</span>
                <span class="bg-rose-500/20 text-rose-400 px-2 py-1 rounded border border-rose-500/30"><i class="fa-solid fa-triangle-exclamation mr-1"></i> Lỗi API</span>
            </div>
        </div>

        <!-- Data Table -->
        <div class="bg-slate-900 rounded-xl border border-slate-800 shadow-lg overflow-hidden">
            <div class="overflow-x-auto w-full">
                <table class="w-full text-left border-collapse min-w-[700px]">
                    <thead>
                        <tr class="bg-slate-950/90 border-b border-slate-800 text-slate-400 text-xs uppercase tracking-wider">
                            <th class="py-3.5 px-4 font-semibold w-24">Mã</th>
                            <th class="py-3.5 px-4 font-semibold text-right w-28">Giá D1</th>
                            <th class="py-3.5 px-4 font-semibold text-right w-32">Vol D1</th>
                            <th class="py-3.5 px-4 font-semibold text-right w-20">P/E</th>
                            <th class="py-3.5 px-4 font-semibold text-right w-20">P/B</th>
                            <th class="py-3.5 px-4 font-semibold text-center w-40">Trạng thái / Lỗi</th>
                        </tr>
                    </thead>
                    <tbody id="stock-table-body" class="divide-y divide-slate-800/60 text-sm">
                        <tr>
                            <td colspan="6" class="text-center py-12 text-slate-500">
                                <i class="fa-solid fa-circle-info mr-2 text-blue-500"></i> Nhấn "Bắt đầu Quét" để kiểm tra kết nối API.
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <!-- Toast Thông báo -->
    <div id="toast" class="fixed bottom-5 right-5 bg-slate-800 border-l-4 border-blue-500 text-white px-5 py-3 rounded-lg shadow-2xl z-50 flex items-center gap-3">
        <i class="fa-solid fa-circle-info text-blue-400"></i>
        <span id="toast-msg">Thông báo...</span>
    </div>

    <script>
        const VN100_SYMBOLS = [
            "ACB", "BID", "CTG", "TCB", "MBB", "STB", "VPB", "HDB", "VIB", "TPB",
            "SHB", "SSB", "LPB", "MSB", "OCB", "EIB", "SSI", "VCI", "HCM", "VIX",
            "MBS", "FTS", "BSI", "CTS", "ORS", "VHM", "VIC", "VRE", "NVL", "PDR",
            "DIG", "NLG", "KDH", "CEO", "DXG", "TCH", "HDG", "KBC", "IDC", "SZC",
            "BCM", "PHR", "HPG", "HSG", "NKG", "CTD", "VCG", "HHV", "FPT", "MWG",
            "PNJ", "FRT", "VNM", "MSN", "SAB", "GAS", "PVD", "PVS", "BSR", "POW",
            "REE", "PC1", "NT2", "GMD", "HAH", "PVT", "VJC", "HVN", "VHC", "ANV"
        ];

        // Thử đổi proxy nếu corsproxy.io bị sập
        // const CORS_PROXY = "https://corsproxy.io/?url=";
        const CORS_PROXY = "https://api.allorigins.win/raw?url="; 

        let stockData = {};
        let isScanning = false;

        const avg = arr => arr.reduce((a, b) => a + b, 0) / arr.length;

        function showToast(msg, isError = false) {
            const toast = document.getElementById('toast');
            const toastMsg = document.getElementById('toast-msg');
            toastMsg.innerText = msg;
            
            if (isError) {
                toast.className = toast.className.replace('border-blue-500', 'border-rose-500');
                toast.querySelector('i').className = "fa-solid fa-triangle-exclamation text-rose-400";
            } else {
                toast.className = toast.className.replace('border-rose-500', 'border-blue-500');
                toast.querySelector('i').className = "fa-solid fa-circle-info text-blue-400";
            }
            
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 4000);
        }

        async function fetchStockData(symbol) {
            try {
                const end_date = new Date().toISOString().split('T')[0];
                const start_date = new Date(Date.now() - 60 * 24 * 60 * 60 * 1000).toISOString().split('T')[0];
                
                const histUrl = `https://finfo-api.vndirect.com.vn/v4/stock_prices?sort=date&q=code:${symbol}~date:gte:${start_date}~date:lte:${end_date}&size=50`;
                const ratioUrl = `https://finfo-api.vndirect.com.vn/v4/ratios?q=code:${symbol}`;

                // Sử dụng Promise.all để gọi song song
                const [histRes, ratioRes] = await Promise.all([
                    fetch(CORS_PROXY + encodeURIComponent(histUrl)).then(r => {
                        if(!r.ok) throw new Error("Lỗi HTTP Lịch sử");
                        return r.json();
                    }),
                    fetch(CORS_PROXY + encodeURIComponent(ratioUrl)).then(r => {
                        if(!r.ok) throw new Error("Lỗi HTTP Chỉ số");
                        return r.json();
                    })
                ]);

                let closes = [], volumes = [], pe = 0, pb = 0;

                if (histRes.data && histRes.data.length > 0) {
                    closes = histRes.data.map(i => parseFloat(i.close || 0));
                    volumes = histRes.data.map(i => parseFloat(i.nmVolume || 0));
                } else {
                    throw new Error("API không trả về dữ liệu giá (Có thể bị chặn)");
                }

                if (ratioRes.data && ratioRes.data.length > 0) {
                    const latest = ratioRes.data[ratioRes.data.length - 1];
                    pe = parseFloat(latest.priceEarning || 0);
                    pb = parseFloat(latest.priceBook || 0);
                }

                // Logic Price Action
                let status = "ĐANG TÍCH LŨY NỀN";
                let detail = "Đang siết nền tích lũy biên độ hẹp.";

                if (closes.length >= 20 && volumes.length >= 20) {
                    const currentVol = volumes[volumes.length - 1];
                    const maVol20 = avg(volumes.slice(-20));
                    const volRatio = maVol20 > 0 ? currentVol / maVol20 : 1;
                    const priceChangePct = closes[closes.length - 2] > 0 
                        ? ((closes[closes.length - 1] - closes[closes.length - 2]) / closes[closes.length - 2]) * 100 
                        : 0;

                    if (volRatio < 0.7 && Math.abs(priceChangePct) < 1.5) {
                        status = "CẠN CUNG";
                        detail = `Vol cạn kiệt (${volRatio.toFixed(2)}x MA20). Biên độ siết chặt.`;
                    } else if (volRatio > 1.5 && priceChangePct > 1.5) {
                        status = "BREAKOUT";
                        detail = `Vol bùng nổ (${volRatio.toFixed(2)}x MA20) kèm giá tăng +${priceChangePct.toFixed(1)}%.`;
                    } else if (closes[closes.length - 1] > avg(closes.slice(-20))) {
                        status = "GOM HÀNG";
                        detail = "Dòng tiền duy trì trên MA20.";
                    }
                }

                const now = new Date();
                const updated_at = now.getFullYear() + "-" + 
                    String(now.getMonth() + 1).padStart(2, '0') + "-" + 
                    String(now.getDate()).padStart(2, '0') + " " + 
                    String(now.getHours()).padStart(2, '0') + ":" + 
                    String(now.getMinutes()).padStart(2, '0') + ":" + 
                    String(now.getSeconds()).padStart(2, '0');

                return {
                    symbol, close: closes[closes.length - 1], volume: volumes[volumes.length - 1],
                    pe, pb, recommendation: status, price_zone: detail, updated_at: updated_at
                };
            } catch (err) {
                console.error(`Lỗi mã ${symbol}:`, err.message);
                // Trả về object báo lỗi rõ ràng
                return { 
                    symbol, 
                    error: true, 
                    errorMsg: err.message || "Lỗi mạng/Proxy",
                    recommendation: "LỖI KẾT NỐI", 
                    price_zone: "Không lấy được dữ liệu" 
                };
            }
        }

        async function startScan() {
            if (isScanning) return;
            isScanning = true;
            stockData = {};
            document.getElementById('stock-table-body').innerHTML = '';
            document.getElementById('total-stocks').innerText = '0';
            
            const btn = document.getElementById('btn-scan');
            const btnExport = document.getElementById('btn-export');
            const icon = document.getElementById('scan-icon');
            const text = document.getElementById('scan-text');
            const progressBar = document.getElementById('progress-bar');
            const progressFill = document.getElementById('progress-fill');

            btn.disabled = true;
            btn.classList.add('opacity-50', 'cursor-not-allowed');
            btnExport.disabled = true;
            btnExport.classList.add('opacity-50', 'cursor-not-allowed');
            
            icon.className = 'fa-solid fa-spinner fa-spin';
            text.innerText = 'Đang quét...';
            progressBar.classList.remove('hidden');
            showToast("Bắt đầu quét dữ liệu. Vui lòng đợi...");

            let completed = 0;
            let errorCount = 0;

            for (let i = 0; i < VN100_SYMBOLS.length; i++) {
                const symbol = VN100_SYMBOLS[i];
                text.innerText = `Quét: ${symbol} (${i + 1}/${VN100_SYMBOLS.length})`;
                
                const data = await fetchStockData(symbol);
                
                if (!data.error) {
                    stockData[symbol] = data;
                    completed++;
                    document.getElementById('total-stocks').innerText = completed;
                } else {
                    errorCount++;
                }
                
                // Render cả mã lỗi và mã thành công
                renderRow(data);

                const pct = ((i + 1) / VN100_SYMBOLS.length) * 100;
                progressFill.style.width = `${pct}%`;

                // Nghỉ 300ms để tránh bị đánh dấu spam proxy
                await new Promise(r => setTimeout(r, 300));
            }

            isScanning = false;
            btn.disabled = false;
            btn.classList.remove('opacity-50', 'cursor-not-allowed');
            icon.className = 'fa-solid fa-rotate-right';
            text.innerText = 'Quét lại';
            setTimeout(() => progressBar.classList.add('hidden'), 1000);

            if (completed > 0) {
                btnExport.disabled = false;
                btnExport.classList.remove('opacity-50', 'cursor-not-allowed');
            }

            // Thông báo kết quả cuối cùng
            if (errorCount === VN100_SYMBOLS.length) {
                showToast(`Toàn bộ 70 mã đều lỗi! Proxy hoặc API VNDirect đang chặn IP của bạn.`, true);
            } else if (errorCount > 0) {
                showToast(`Hoàn tất! Thành công: ${completed} mã, Lỗi: ${errorCount} mã.`, true);
            } else {
                showToast(`Tuyệt vời! Đã lấy thành công toàn bộ ${completed} mã.`, false);
            }
        }

        function renderRow(item) {
            const tbody = document.getElementById('stock-table-body');
            if (tbody.querySelector('td[colspan="6"]')) tbody.innerHTML = '';

            const tr = document.createElement('tr');
            
            // Xử lý giao diện nếu là dòng lỗi
            if (item.error) {
                tr.className = "bg-rose-900/20 border-b border-rose-800/40 hover:bg-rose-900/30 transition";
                tr.innerHTML = `
                    <td class="py-3 px-4 font-bold text-rose-400 whitespace-nowrap">${item.symbol}</td>
                    <td colspan="4" class="py-3 px-4 text-right text-rose-300 text-xs italic">${item.errorMsg}</td>
                    <td class="py-3 px-4 text-center whitespace-nowrap">
                        <span class="text-[10px] px-2 py-1 rounded-full font-semibold bg-rose-500/20 text-rose-400 border border-rose-500/30">
                            <i class="fa-solid fa-xmark mr-1"></i> LỖI
                        </span>
                    </td>
                `;
                tbody.appendChild(tr);
                return;
            }

            // Xử lý giao diện nếu thành công
            tr.className = "hover:bg-slate-800/40 transition border-b border-slate-800/40";
            
            const closePrice = item.close ? item.close.toLocaleString('vi-VN') : '—';
            const volVal = item.volume ? item.volume.toLocaleString('vi-VN') : '—';
            const peVal = item.pe ? item.pe.toFixed(1) : '—';
            const pbVal = item.pb ? item.pb.toFixed(1) : '—';

            let badgeColor = "bg-slate-800 text-slate-300";
            if (item.recommendation.includes("BREAKOUT")) badgeColor = "bg-emerald-500/20 text-emerald-400 border border-emerald-500/30";
            else if (item.recommendation.includes("CẠN CUNG")) badgeColor = "bg-amber-500/20 text-amber-400 border border-amber-500/30";
            else if (item.recommendation.includes("GOM")) badgeColor = "bg-blue-500/20 text-blue-400 border border-blue-500/30";

            tr.innerHTML = `
                <td class="py-3 px-4 font-bold text-white whitespace-nowrap">
                    <span class="text-blue-400 font-black text-sm">${item.symbol}</span>
                </td>
                <td class="py-3 px-4 text-right font-semibold text-slate-200 whitespace-nowrap">${closePrice}</td>
                <td class="py-3 px-4 text-right text-amber-400 font-medium whitespace-nowrap">${volVal}</td>
                <td class="py-3 px-4 text-right text-slate-300 whitespace-nowrap">${peVal}</td>
                <td class="py-3 px-4 text-right text-slate-300 whitespace-nowrap">${pbVal}</td>
                <td class="py-3 px-4 text-center whitespace-nowrap">
                    <span class="text-[10px] px-2 py-1 rounded-full font-semibold ${badgeColor}">${item.recommendation}</span>
                </td>
            `;
            tbody.appendChild(tr);
        }

        function exportJSON() {
            if (Object.keys(stockData).length === 0) {
                showToast("Không có dữ liệu thành công nào để xuất!", true);
                return;
            }

            const jsonString = JSON.stringify(stockData, null, 4);
            const blob = new Blob([jsonString], { type: "application/json" });
            const url = URL.createObjectURL(blob);
            
            const a = document.createElement('a');
            a.href = url;
            a.download = "data.json";
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
            
            showToast(`Đã xuất file data.json thành công!`, false);
        }

        // Tìm kiếm
        document.getElementById('search-input').addEventListener('input', (e) => {
            const term = e.target.value.toUpperCase();
            const rows = document.querySelectorAll('#stock-table-body tr');
            rows.forEach(row => {
                const symbol = row.cells[0]?.innerText || '';
                row.style.display = symbol.includes(term) ? '' : 'none';
            });
        });
    </script>
</body>
</html>
