<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pro Quant Screener - VN100</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
        
        @media (max-width: 640px) {
            .mobile-table th, .mobile-table td { padding: 0.5rem 0.25rem; font-size: 12px; }
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans">

    <header class="bg-slate-900 border-b border-slate-800 sticky top-0 z-30 shadow-md">
        <div class="max-w-7xl mx-auto px-4 py-4 flex flex-col md:flex-row justify-between items-center gap-4">
            <div class="flex items-center space-x-3">
                <div class="bg-blue-600 text-white p-2.5 rounded-xl shadow-lg shadow-blue-500/30">
                    <i class="fa-solid fa-chart-candlestick text-xl"></i>
                </div>
                <div>
                    <h1 class="text-xl font-bold tracking-wide text-white">Pro Quant Screener <span class="text-xs bg-blue-500/20 text-blue-400 px-2 py-0.5 rounded border border-blue-500/30">Vnstock Data</span></h1>
                    <p class="text-xs text-slate-400">Dữ liệu quét tự động từ VCI (Price Action D1)</p>
                </div>
            </div>
            
            <div class="flex items-center gap-3">
                <div class="text-xs text-slate-300 bg-slate-800/60 px-3 py-2 rounded-lg border border-slate-700/50 hidden md:block">
                    <i class="fa-solid fa-database text-blue-400 mr-1"></i> Tổng mã: <strong id="total-stocks" class="text-white">0</strong>
                </div>
                
                <button onclick="refreshData()" class="px-4 py-2 bg-blue-600 hover:bg-blue-500 text-white rounded-lg text-sm font-semibold transition flex items-center gap-2 shadow">
                    <i class="fa-solid fa-rotate" id="refresh-icon"></i> <span>Làm mới</span>
                </button>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-2 md:px-4 py-6">
        <div class="bg-slate-900 p-4 rounded-xl border border-slate-800 shadow-sm mb-6 flex flex-col md:flex-row justify-between items-center gap-4">
            <div class="relative w-full md:w-80">
                <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-slate-400">
                    <i class="fa-solid fa-magnifying-glass"></i>
                </span>
                <input type="text" id="search-input" placeholder="Tìm kiếm mã..." 
                    class="w-full pl-10 pr-4 py-2 bg-slate-950 border border-slate-700 rounded-lg text-sm text-white focus:outline-none focus:border-blue-500 transition">
            </div>
            <div class="flex gap-2 text-xs">
                <span class="bg-emerald-500/20 text-emerald-400 px-2 py-1 rounded border border-emerald-500/30"><i class="fa-solid fa-arrow-trend-up mr-1"></i> Breakout</span>
                <span class="bg-amber-500/20 text-amber-400 px-2 py-1 rounded border border-amber-500/30"><i class="fa-solid fa-box-archive mr-1"></i> Cạn cung</span>
            </div>
        </div>

        <div class="bg-slate-900 rounded-xl border border-slate-800 shadow-lg overflow-hidden">
            <div class="overflow-x-auto w-full">
                <table class="w-full text-left border-collapse min-w-[500px] mobile-table">
                    <thead>
                        <tr class="bg-slate-950/90 border-b border-slate-800 text-slate-400 text-xs uppercase tracking-wider">
                            <th class="py-3.5 px-2 md:px-4 font-semibold w-20">Mã</th>
                            <th class="py-3.5 px-2 md:px-4 font-semibold text-right">Giá D1 (VNĐ)</th>
                            <th class="py-3.5 px-2 md:px-4 font-semibold text-right">Khối lượng</th>
                            <th class="py-3.5 px-2 md:px-4 font-semibold text-center">Trạng thái</th>
                        </tr>
                    </thead>
                    <tbody id="stock-table-body" class="divide-y divide-slate-800/60 text-sm">
                        <tr>
                            <td colspan="4" class="text-center py-12 text-slate-500">
                                <i class="fa-solid fa-spinner fa-spin mr-2 text-blue-500"></i> Đang tải dữ liệu từ data.json...
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <script>
        let stockData = {};

        async function loadData() {
            try {
                // Thêm timestamp để trình duyệt không lưu cache file data.json cũ
                const response = await fetch('data.json?t=' + new Date().getTime());
                if (!response.ok) throw new Error('Không thể tải data.json');
                
                stockData = await response.json();
                renderTable();
                document.getElementById('total-stocks').innerText = Object.keys(stockData).length;
            } catch (error) {
                console.error(error);
                document.getElementById('stock-table-body').innerHTML = `
                    <tr><td colspan="4" class="text-center py-8 text-rose-400 font-semibold">
                        <i class="fa-solid fa-triangle-exclamation mr-1"></i> Chưa có dữ liệu data.json. Hãy chạy file Python để tạo file!
                    </td></tr>`;
            }
        }

        function refreshData() {
            const icon = document.getElementById('refresh-icon');
            icon.classList.add('fa-spin');
            loadData();
            setTimeout(() => icon.classList.remove('fa-spin'), 600);
        }

        function renderTable() {
            const tbody = document.getElementById('stock-table-body');
            tbody.innerHTML = '';

            const searchTerm = document.getElementById('search-input').value.toUpperCase();
            const filtered = Object.values(stockData)
                .filter(item => item.symbol.includes(searchTerm))
                .sort((a, b) => a.symbol.localeCompare(b.symbol)); // Sắp xếp A-Z

            if (filtered.length === 0) {
                tbody.innerHTML = `<tr><td colspan="4" class="text-center py-8 text-slate-500">Không tìm thấy mã cổ phiếu.</td></tr>`;
                return;
            }

            filtered.forEach(item => {
                const tr = document.createElement('tr');
                tr.className = "hover:bg-slate-800/40 transition border-b border-slate-800/40";
                
                const closePrice = item.close ? item.close.toLocaleString('vi-VN') : '—';
                
                // Format khối lượng (VD: 8.4M)
                const formatVol = (num) => {
                    if (!num) return '—';
                    if (num >= 1000000) return (num / 1000000).toFixed(1) + 'M';
                    if (num >= 1000) return (num / 1000).toFixed(0) + 'K';
                    return num;
                };
                const volVal = formatVol(item.volume);

                let badgeColor = "bg-slate-800 text-slate-300";
                let shortStatus = item.recommendation;
                
                if (item.recommendation.includes("BREAKOUT")) {
                    badgeColor = "bg-emerald-500/20 text-emerald-400 border border-emerald-500/30";
                    shortStatus = "BREAKOUT";
                } else if (item.recommendation.includes("CẠN CUNG")) {
                    badgeColor = "bg-amber-500/20 text-amber-400 border border-amber-500/30";
                    shortStatus = "CẠN CUNG";
                } else if (item.recommendation.includes("GOM")) {
                    badgeColor = "bg-blue-500/20 text-blue-400 border border-blue-500/30";
                    shortStatus = "GOM HÀNG";
                } else if (item.recommendation.includes("TÍCH LŨY")) {
                    shortStatus = "TÍCH LŨY";
                }

                tr.innerHTML = `
                    <td class="py-3 px-2 md:px-4 font-bold text-white whitespace-nowrap">
                        <span class="text-blue-400 font-black text-sm">${item.symbol}</span>
                    </td>
                    <td class="py-3 px-2 md:px-4 text-right font-semibold text-slate-200 whitespace-nowrap">${closePrice}</td>
                    <td class="py-3 px-2 md:px-4 text-right text-slate-400 font-medium whitespace-nowrap">${volVal}</td>
                    <td class="py-3 px-2 md:px-4 text-center whitespace-nowrap">
                        <span class="text-[10px] px-2 py-1 rounded-full font-semibold ${badgeColor}">${shortStatus}</span>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        document.getElementById('search-input').addEventListener('input', renderTable);
        
        // Tải dữ liệu ngay khi mở trang
        loadData();
    </script>
</body>
</html>
